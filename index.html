<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo❤Biodanza - Guía Visual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div id="modeIndicator" class="mode-indicator view-mode">Modo Visualización</div>
        
        <h1 class="text-center mb-4">Guía Visual<br>para Yo<span style="color:red">❤</span>Biodanza</h1>
        
        <!-- Panel de administración (oculto por defecto) -->
        <div id="adminPanel" class="admin-panel">
            <h3>Modo Actualización</h3>
            <div class="mb-3">
                <button id="addVideoBtn" class="btn btn-primary">Agregar Video</button>
            </div>
            
            <!-- Formulario para agregar video -->
            <div id="addVideoForm" style="display: none;">
                <div class="mb-3">
                    <label for="videoTitle" class="form-label">Título del Video</label>
                    <input type="text" class="form-control" id="videoTitle" placeholder="Ej: video1">
                </div>
                <div class="mb-3">
                    <label for="videoClassification" class="form-label">Clasificación</label>
                    <input type="text" class="form-control" id="videoClassification" placeholder="Ej: deportes">
                </div>
                <div class="mb-3">
                    <label for="videoFile" class="form-label">Archivo de Video</label>
                    <input type="file" class="form-control" id="videoFile" accept="video/*">
                </div>
                <button id="submitVideoBtn" class="btn btn-success">Subir Video</button>
                <button id="cancelAddBtn" class="btn btn-secondary">Cancelar</button>
            </div>
            
            <!-- Lista de videos para eliminar -->
            <div id="deleteSection" class="mt-4">
                <h4>Eliminar Videos</h4>
                <div id="deleteVideoList" class="list-group">
                    <!-- Los videos se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
        
        <!-- Contenedor principal para los videos (ahora como acordeón) -->
        <div id="videosContainer" class="accordion">
            <!-- Los videos se cargarán aquí dinámicamente como acordeones -->
        </div>
    </div>

    <!-- Modal para mensajes -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalTitle">Mensaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageModalBody">
                    <!-- Mensaje dinámico -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- No necesitamos agregar el modal de video aquí, se creará dinámicamente -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
