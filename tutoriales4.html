<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Videos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .video-container {
            margin-bottom: 20px;
        }
        .video-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .video-player {
            width: 100%;
            border-radius: 5px;
        }
        .vertical-video {
            max-width: 360px;
            margin: 0 auto;
        }
        .horizontal-video {
            width: 100%;
        }
        .admin-panel {
            background-color: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .mode-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 1000;
        }
        .view-mode {
            background-color: #28a745;
            color: white;
        }
        .edit-mode {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div id="modeIndicator" class="mode-indicator view-mode">Modo Visualización</div>
        
        <h1 class="text-center mb-4">Visualizador de Videos</h1>
        
        <!-- Panel de administración (oculto por defecto) -->
        <div id="adminPanel" class="admin-panel">
            <h3>Modo Actualización</h3>
            <div class="mb-3">
                <button id="addVideoBtn" class="btn btn-primary">Agregar Video</button>
            </div>
            
            <!-- Formulario para agregar video -->
            <div id="addVideoForm" style="display: none;">
                <div class="mb-3">
                    <label for="videoTitle" class="form-label">Título del Video</label>
                    <input type="text" class="form-control" id="videoTitle" placeholder="Ej: video1">
                </div>
                <div class="mb-3">
                    <label for="videoClassification" class="form-label">Clasificación</label>
                    <input type="text" class="form-control" id="videoClassification" placeholder="Ej: deportes">
                </div>
                <div class="mb-3">
                    <label for="videoFormat" class="form-label">Formato</label>
                    <select class="form-select" id="videoFormat">
                        <option value="horizontal">Horizontal</option>
                        <option value="vertical">Vertical</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="videoFile" class="form-label">Archivo de Video</label>
                    <input type="file" class="form-control" id="videoFile" accept="video/*">
                </div>
                <button id="submitVideoBtn" class="btn btn-success">Subir Video</button>
                <button id="cancelAddBtn" class="btn btn-secondary">Cancelar</button>
            </div>
            
            <!-- Lista de videos para eliminar -->
            <div id="deleteSection" class="mt-4">
                <h4>Eliminar Videos</h4>
                <div id="deleteVideoList" class="list-group">
                    <!-- Los videos se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
        
        <!-- Contenedor principal para los videos -->
        <div id="videosContainer">
            <!-- Los videos se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Modal para mensajes -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalTitle">Mensaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageModalBody">
                    <!-- Mensaje dinámico -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        function encriptar(texto, desplazamiento) {
            return texto.split('').map(char => {
                if (char >= 'A' && char <= 'Z') {
                    return String.fromCharCode((char.charCodeAt(0) - 65 + desplazamiento) % 26 + 65);
                } else if (char >= 'a' && char <= 'z') {
                    return String.fromCharCode((char.charCodeAt(0) - 97 + desplazamiento) % 26 + 97);
                }
                return char; // No modifica caracteres no alfabéticos
            }).join('');
        }

        
        // Configuración
        const config = {
            githubRepo: 'ilovebiodanza/myvideos', // Reemplazar con tu repositorio
            branch: 'main', // Rama del repositorio
            token: encriptar('jks_XQaqN3xUXcLCbw3OpqcaN7y7yixb4d30au7Q',-3) // Token de acceso a GitHub (necesita permisos de escritura)
        };
        
        // Variables de estado
        let currentMode = 'view'; // 'view' o 'edit'
        const messageModal = new bootstrap.Modal(document.getElementById('messageModal'));
        
        // Elementos del DOM
        const modeIndicator = document.getElementById('modeIndicator');
        const adminPanel = document.getElementById('adminPanel');
        const videosContainer = document.getElementById('videosContainer');
        const addVideoBtn = document.getElementById('addVideoBtn');
        const addVideoForm = document.getElementById('addVideoForm');
        const submitVideoBtn = document.getElementById('submitVideoBtn');
        const cancelAddBtn = document.getElementById('cancelAddBtn');
        const deleteVideoList = document.getElementById('deleteVideoList');
        
        // Manejadores de eventos
        document.addEventListener('keydown', handleKeyCombination);
        addVideoBtn.addEventListener('click', () => addVideoForm.style.display = 'block');
        cancelAddBtn.addEventListener('click', () => addVideoForm.style.display = 'none');
        submitVideoBtn.addEventListener('click', uploadVideo);
        
        // Inicialización
        loadVideos();
        
        // Funciones principales
        function handleKeyCombination(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'A') {
                setMode('edit');
                e.preventDefault();
            } else if (e.ctrlKey && e.shiftKey && e.key === 'V') {
                setMode('view');
                e.preventDefault();
            }
        }
        
        function setMode(mode) {
            currentMode = mode;
            if (mode === 'edit') {
                modeIndicator.textContent = 'Modo Actualización';
                modeIndicator.className = 'mode-indicator edit-mode';
                adminPanel.style.display = 'block';
                loadVideosForDeletion();
            } else {
                modeIndicator.textContent = 'Modo Visualización';
                modeIndicator.className = 'mode-indicator view-mode';
                adminPanel.style.display = 'none';
            }
        }
        
        async function loadVideos() {
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents?ref=${config.branch}`);
                if (!response.ok) throw new Error('Error al cargar las clasificaciones');
                
                const classifications = await response.json();
                videosContainer.innerHTML = '';
                
                for (const classification of classifications) {
                    if (classification.type === 'dir') {
                        await loadFormats(classification.name);
                    }
                }
            } catch (error) {
                showMessage('Error', `No se pudieron cargar los videos: ${error.message}`);
            }
        }
        
        async function loadFormats(classification) {
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${classification}?ref=${config.branch}`);
                if (!response.ok) throw new Error(`Error al cargar los formatos para ${classification}`);
                
                const formats = await response.json();
                const classificationContainer = document.createElement('div');
                classificationContainer.className = 'classification-container mb-5';
                
                const classificationTitle = document.createElement('h2');
                classificationTitle.textContent = classification;
                classificationTitle.className = 'mb-3';
                classificationContainer.appendChild(classificationTitle);
                
                for (const format of formats) {
                    if (format.type === 'dir') {
                        await loadVideosForFormat(classification, format.name, classificationContainer);
                    }
                }
                
                videosContainer.appendChild(classificationContainer);
            } catch (error) {
                console.error(`Error al cargar formatos para ${classification}:`, error);
            }
        }
        
        async function loadVideosForFormat(classification, format, container) {
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${classification}/${format}?ref=${config.branch}`);
                if (!response.ok) throw new Error(`Error al cargar videos para ${classification}/${format}`);
                
                const videos = await response.json();
                const formatContainer = document.createElement('div');
                formatContainer.className = 'format-container mb-4';
                
                const formatTitle = document.createElement('h3');
                formatTitle.textContent = `Formato: ${format}`;
                formatTitle.className = 'mb-3';
                formatContainer.appendChild(formatTitle);
                
                const row = document.createElement('div');
                row.className = 'row';
                
                for (const video of videos) {
                    if (video.type === 'file' && isVideoFile(video.name)) {
                        const videoElement = createVideoElement(classification, format, video);
                        const col = document.createElement('div');
                        col.className = format === 'vertical' ? 'col-md-6 col-lg-4' : 'col-12';
                        col.appendChild(videoElement);
                        row.appendChild(col);
                    }
                }
                
                formatContainer.appendChild(row);
                container.appendChild(formatContainer);
            } catch (error) {
                console.error(`Error al cargar videos para ${classification}/${format}:`, error);
            }
        }
        
        function createVideoElement(classification, format, video) {
            const videoCard = document.createElement('div');
            videoCard.className = 'video-card';
            
            const title = document.createElement('h4');
            title.textContent = video.name.replace(/\.[^/.]+$/, ''); // Remover extensión
            videoCard.appendChild(title);
            
            const videoPlayer = document.createElement('video');
            videoPlayer.className = `video-player ${format}-video`;
            videoPlayer.controls = true;
            videoPlayer.src = video.download_url;
            videoCard.appendChild(videoPlayer);
            
            if (currentMode === 'edit') {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-danger btn-sm mt-2';
                deleteBtn.textContent = 'Eliminar';
                deleteBtn.onclick = () => deleteVideo(classification, format, video.name);
                videoCard.appendChild(deleteBtn);
            }
            
            return videoCard;
        }
        
        async function loadVideosForDeletion() {
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents?ref=${config.branch}`);
                if (!response.ok) throw new Error('Error al cargar las clasificaciones');
                
                const classifications = await response.json();
                deleteVideoList.innerHTML = '';
                
                for (const classification of classifications) {
                    if (classification.type === 'dir') {
                        await loadFormatsForDeletion(classification.name);
                    }
                }
            } catch (error) {
                showMessage('Error', `No se pudieron cargar los videos para eliminación: ${error.message}`);
            }
        }
        
        async function loadFormatsForDeletion(classification) {
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${classification}?ref=${config.branch}`);
                if (!response.ok) throw new Error(`Error al cargar los formatos para ${classification}`);
                
                const formats = await response.json();
                
                for (const format of formats) {
                    if (format.type === 'dir') {
                        await loadVideosListForDeletion(classification, format.name);
                    }
                }
            } catch (error) {
                console.error(`Error al cargar formatos para eliminación en ${classification}:`, error);
            }
        }
        
        async function loadVideosListForDeletion(classification, format) {
            try {
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${classification}/${format}?ref=${config.branch}`);
                if (!response.ok) throw new Error(`Error al cargar videos para ${classification}/${format}`);
                
                const videos = await response.json();
                
                for (const video of videos) {
                    if (video.type === 'file' && isVideoFile(video.name)) {
                        const listItem = document.createElement('button');
                        listItem.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                        listItem.textContent = `${classification}/${format}/${video.name}`;
                        
                        const deleteBtn = document.createElement('span');
                        deleteBtn.className = 'badge bg-danger rounded-pill';
                        deleteBtn.textContent = 'Eliminar';
                        deleteBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteVideo(classification, format, video.name);
                        };
                        
                        listItem.appendChild(deleteBtn);
                        deleteVideoList.appendChild(listItem);
                    }
                }
            } catch (error) {
                console.error(`Error al cargar videos para eliminación en ${classification}/${format}:`, error);
            }
        }
        
        async function uploadVideo() {
            const title = document.getElementById('videoTitle').value.trim();
            const classification = document.getElementById('videoClassification').value.trim();
            const format = document.getElementById('videoFormat').value;
            const fileInput = document.getElementById('videoFile');
            
            if (!title || !classification || !fileInput.files.length) {
                showMessage('Error', 'Por favor complete todos los campos');
                return;
            }
            
            const file = fileInput.files[0];
            const fileName = `${title}.${file.name.split('.').pop()}`;
            const path = `${classification}/${format}/${fileName}`;
            
            try {
                // Leer el archivo como base64
                const fileContent = await readFileAsBase64(file);
                
                // Crear el contenido para GitHub API
                const content = fileContent.split(',')[1]; // Remover el prefijo data:...
                
                // Crear el commit
                const response = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Agregar video: ${fileName}`,
                        content: content,
                        branch: config.branch
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Error al subir el video');
                }
                
                showMessage('Éxito', 'Video subido correctamente');
                addVideoForm.style.display = 'none';
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoClassification').value = '';
                document.getElementById('videoFile').value = '';
                
                // Recargar los videos
                loadVideos();
                if (currentMode === 'edit') {
                    loadVideosForDeletion();
                }
            } catch (error) {
                showMessage('Error', `No se pudo subir el video: ${error.message}`);
            }
        }
        
        async function deleteVideo(classification, format, videoName) {
            if (!confirm(`¿Está seguro que desea eliminar ${classification}/${format}/${videoName}?`)) {
                return;
            }
            
            try {
                // Primero necesitamos obtener el SHA del archivo a eliminar
                const getResponse = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${classification}/${format}/${videoName}?ref=${config.branch}`);
                if (!getResponse.ok) throw new Error('No se pudo obtener información del video');
                
                const fileInfo = await getResponse.json();
                
                // Luego hacemos la solicitud para eliminar
                const deleteResponse = await fetch(`https://api.github.com/repos/${config.githubRepo}/contents/${classification}/${format}/${videoName}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Eliminar video: ${videoName}`,
                        sha: fileInfo.sha,
                        branch: config.branch
                    })
                });
                
                if (!deleteResponse.ok) {
                    const errorData = await deleteResponse.json();
                    throw new Error(errorData.message || 'Error al eliminar el video');
                }
                
                showMessage('Éxito', 'Video eliminado correctamente');
                
                // Recargar los videos
                loadVideos();
                if (currentMode === 'edit') {
                    loadVideosForDeletion();
                }
            } catch (error) {
                showMessage('Error', `No se pudo eliminar el video: ${error.message}`);
            }
        }
        
        // Funciones auxiliares
        function isVideoFile(filename) {
            const videoExtensions = ['.mp4', '.webm', '.ogg', '.mov', '.avi'];
            return videoExtensions.some(ext => filename.toLowerCase().endsWith(ext));
        }
        
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        function showMessage(title, message) {
            document.getElementById('messageModalTitle').textContent = title;
            document.getElementById('messageModalBody').textContent = message;
            messageModal.show();
        }
    </script>
</body>
</html>
